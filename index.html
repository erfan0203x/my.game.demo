<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 استیکمن آنلاین</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .game-wrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            max-width: 100%;
        }
        #gameCanvas {
            display: block;
            background-color: #eef2f7;
            border-radius: 16px;
            width: 600px;
            height: 400px;
            max-width: 100%;
            height: auto;
            aspect-ratio: 600/400;
            box-shadow: inset 0 0 0 2px #0f3460;
            touch-action: none;
            cursor: default;
        }
        .joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            touch-action: none;
            z-index: 10;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .joystick-thumb {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #e6a800);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(255,215,0,0.5), inset 0 -3px 0 rgba(0,0,0,0.2);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: box-shadow 0.1s;
            pointer-events: none;
            touch-action: none;
        }
        .joystick-zone.active .joystick-thumb {
            box-shadow: 0 0 30px rgba(255,215,0,0.8), inset 0 -3px 0 rgba(0,0,0,0.2);
        }
        .info-bar {
            margin-top: 16px;
            color: #a8b2d1;
            text-align: center;
            font-size: 14px;
            background: #0f172a;
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .info-bar .badge {
            background: #2d3748;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
        #statusText {
            color: #f1c40f;
            font-weight: 600;
        }
        #posStatus {
            color: #cbd5e1;
            font-size: 13px;
        }
        @media (max-width: 650px) {
            .game-wrapper { padding: 10px; border-radius: 20px; }
            .joystick-zone { width: 100px; height: 100px; bottom: 20px; left: 20px; }
            .joystick-thumb { width: 50px; height: 50px; }
        }
        .error-msg {
            color: #ff6b6b;
            font-weight: bold;
            background: #2d1b1b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .try-again-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 5px;
        }
        .try-again-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="joystick-zone" id="joystickZone">
        <div class="joystick-thumb" id="joystickThumb"></div>
    </div>

    <div class="info-bar">
        <div>🕹️ <span id="statusText">در حال اتصال...</span></div>
        <div class="badge">⌨️ فلش‌ها / WASD</div>
        <div id="posStatus">📍 (300, 200)</div>
    </div>
</div>

<script>
    // ============================================================
    //  متغیرهای اصلی
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const posStatus = document.getElementById('posStatus');
    const statusText = document.getElementById('statusText');

    const W = 600, H = 400;
    const PADDING = 30;
    const SPEED = 4.5;
    const MARGIN = 25;

    let myX = W/2, myY = H/2;
    let myColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
    let myId = null;

    let peer = null;
    let isHost = false;
    let connections = [];
    let players = {};
    let hostConnection = null;
    let isConnected = false;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 5;

    // لیست سرورهای سیگنالینگ
    const SIGNALING_SERVERS = [
        'https://0.peerjs.com',
        'https://1.peerjs.com',
        'https://peerjs.com'
    ];
    let currentServerIndex = 0;

    // ---- جوی‌استیک ----
    const joystickZone = document.getElementById('joystickZone');
    const joystickThumb = document.getElementById('joystickThumb');
    let isDragging = false;
    let joyX = 0, joyY = 0;

    // ---- کیبورد ----
    const keys = {
        ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
        w: false, a: false, s: false, d: false
    };

    // ============================================================
    //  توابع رسم
    // ============================================================
    function drawStickman(cx, cy, color = '#1a2639', isMe = false, host = false) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.arc(cx, cy - 22, 16, 0, Math.PI * 2);
        ctx.fillStyle = '#ffe0b0';
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1a2639';
        ctx.beginPath();
        ctx.arc(cx - 6, cy - 26, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 6, cy - 26, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx, cy - 6);
        ctx.lineTo(cx, cy + 18);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx - 18, cy + 2);
        ctx.lineTo(cx + 18, cy + 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx, cy + 18);
        ctx.lineTo(cx - 14, cy + 40);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx, cy + 18);
        ctx.lineTo(cx + 14, cy + 40);
        ctx.stroke();

        ctx.fillStyle = '#d32f2f';
        ctx.beginPath();
        ctx.ellipse(cx - 14, cy + 41, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 14, cy + 41, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        if (isMe) {
            ctx.fillStyle = '#ffd700';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⭐', cx, cy - 45);
        }
        if (host) {
            ctx.fillStyle = '#ffd700';
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('👑', cx + 30, cy - 45);
        }

        ctx.restore();
    }

    function drawScene() {
        ctx.clearRect(0, 0, W, H);

        ctx.save();
        ctx.strokeStyle = '#2979ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#2979ff40';
        ctx.shadowBlur = 12;
        ctx.strokeRect(PADDING, PADDING, W - (PADDING*2), H - (PADDING*2));
        ctx.fillStyle = '#e3f2fd20';
        ctx.fillRect(PADDING, PADDING, W - (PADDING*2), H - (PADDING*2));
        ctx.restore();

        for (let id in players) {
            if (id === myId) continue;
            const p = players[id];
            if (p) {
                drawStickman(p.x, p.y, p.color, false, p.isHost);
            }
        }
        drawStickman(myX, myY, myColor, true, isHost);

        const count = Object.keys(players).length;
        posStatus.textContent = `📍 (${Math.round(myX)}, ${Math.round(myY)})  |  بازیکنان: ${count}`;
    }

    // ============================================================
    //  منطق PeerJS
    // ============================================================
    function startPeer() {
        if (peer) {
            peer.destroy();
            peer = null;
        }

        const serverUrl = SIGNALING_SERVERS[currentServerIndex];
        statusText.textContent = `🔄 اتصال به سرور ${currentServerIndex + 1}/${SIGNALING_SERVERS.length}...`;

        peer = new Peer(undefined, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'turn:relay1.expressturn.com:3478', username: 'efgh', credential: 'abcdefgh' }
                ]
            },
            host: serverUrl.replace('https://', ''),
            path: '/',
            port: 443,
            secure: true
        });

        peer.on('open', (id) => {
            myId = id;
            isConnected = true;
            reconnectAttempts = 0;
            statusText.textContent = `✅ متصل (${id})`;
            console.log('✅ Peer ID:', id);

            // اگر قبلاً هاست نبودیم، سعی می‌کنیم به هاست وصل شویم
            if (!isHost) {
                tryConnectToHost();
            } else {
                players[myId] = { x: myX, y: myY, color: myColor, isHost: true };
                broadcastState();
            }
        });

        peer.on('error', (err) => {
            console.error('❌ Peer error:', err);
            if (err.type === 'unavailable-id' || err.message.includes('ID taken')) {
                if (!isHost) {
                    statusText.textContent = '🔄 هاست موجود، اتصال...';
                    setTimeout(() => tryConnectToHost(), 1000);
                }
            } else if (err.type === 'peer-unavailable') {
                becomeHost();
            } else if (err.type === 'disconnected' || err.message.includes('disconnected')) {
                // تلاش مجدد با سرور بعدی
                currentServerIndex = (currentServerIndex + 1) % SIGNALING_SERVERS.length;
                statusText.textContent = `🔄 تغییر سرور...`;
                setTimeout(() => startPeer(), 2000);
            } else {
                statusText.textContent = `⚠️ خطا: ${err.message || err.type}`;
                if (reconnectAttempts < MAX_RECONNECT) {
                    reconnectAttempts++;
                    setTimeout(() => startPeer(), 3000);
                } else {
                    statusText.innerHTML = '❌ <span class="error-msg">اتصال ممکن نیست</span>';
                }
            }
        });

        peer.on('connection', (conn) => {
            if (isHost) {
                handleNewConnection(conn);
            } else {
                console.log('🔗 اتصال ورودی از:', conn.peer);
                // اگر کلاینت هستیم و کسی به ما وصل شد، یعنی ما هاست شدیم!
                becomeHost();
            }
        });

        // تایم‌اوت برای اتصال
        setTimeout(() => {
            if (!isConnected && !isHost) {
                statusText.textContent = '⏳ اتصال طولانی شد، تبدیل به هاست...';
                becomeHost();
            }
        }, 10000);
    }

    function tryConnectToHost() {
        if (isHost) return;
        if (hostConnection && hostConnection.open) return;

        statusText.textContent = '🔗 در حال اتصال به هاست...';
        const conn = peer.connect('host', { reliable: true });

        const timeout = setTimeout(() => {
            if (!conn.open) {
                conn.close();
                becomeHost();
            }
        }, 8000);

        conn.on('open', () => {
            clearTimeout(timeout);
            hostConnection = conn;
            isConnected = true;
            statusText.textContent = '🔗 متصل به هاست';
            console.log('✅ متصل به هاست شدیم');

            conn.on('data', (data) => {
                if (data.type === 'state') {
                    players = data.players || {};
                    if (!players[myId]) {
                        players[myId] = { x: myX, y: myY, color: myColor, isHost: false };
                        sendMyPos();
                    }
                }
            });

            conn.on('close', () => {
                hostConnection = null;
                isConnected = false;
                statusText.textContent = '❌ هاست قطع شد، تبدیل به هاست...';
                becomeHost();
            });

            sendMyPos();
        });

        conn.on('error', (err) => {
            clearTimeout(timeout);
            console.log('❌ خطا در اتصال به هاست:', err);
            becomeHost();
        });
    }

    function becomeHost() {
        if (isHost) return;
        if (!peer) return;

        isHost = true;
        isConnected = true;
        statusText.textContent = '👑 هاست (سرور)';
        console.log('✅ ما هاست شدیم');

        players = {};
        players[myId] = { x: myX, y: myY, color: myColor, isHost: true };
        broadcastState();
    }

    function handleNewConnection(conn) {
        const peerId = conn.peer;
        console.log('🔗 کلاینت جدید:', peerId);
        connections.push(conn);

        conn.on('open', () => {
            if (!players[peerId]) {
                players[peerId] = {
                    x: W/2,
                    y: H/2,
                    color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'),
                    isHost: false
                };
            }
            sendStateToClient(conn);
            broadcastState();
        });

        conn.on('data', (data) => {
            if (data.type === 'position') {
                if (players[peerId]) {
                    players[peerId].x = data.x;
                    players[peerId].y = data.y;
                    players[peerId].color = data.color || players[peerId].color;
                } else {
                    players[peerId] = { x: data.x, y: data.y, color: data.color || '#ff5722', isHost: false };
                }
                broadcastState();
            }
        });

        conn.on('close', () => {
            console.log('❌ کلاینت قطع شد:', peerId);
            connections = connections.filter(c => c.peer !== peerId);
            delete players[peerId];
            broadcastState();
        });
    }

    function sendStateToClient(conn) {
        if (conn.open) {
            conn.send({ type: 'state', players: players });
        }
    }

    function broadcastState() {
        if (!isHost) return;
        for (let conn of connections) {
            if (conn.open) {
                conn.send({ type: 'state', players: players });
            }
        }
    }

    function sendMyPos() {
        if (hostConnection && hostConnection.open) {
            hostConnection.send({
                type: 'position',
                x: myX,
                y: myY,
                color: myColor
            });
        }
    }

    // ============================================================
    //  حلقه بازی
    // ============================================================
    function updatePosition() {
        let dx = 0, dy = 0;
        if (isDragging) {
            dx = joyX * SPEED;
            dy = joyY * SPEED;
        } else {
            if (keys.ArrowLeft || keys.a) dx = -SPEED;
            if (keys.ArrowRight || keys.d) dx = SPEED;
            if (keys.ArrowUp || keys.w) dy = -SPEED;
            if (keys.ArrowDown || keys.s) dy = SPEED;
        }

        myX += dx;
        myY += dy;
        myX = Math.max(PADDING + MARGIN, Math.min(W - PADDING - MARGIN, myX));
        myY = Math.max(PADDING + MARGIN, Math.min(H - PADDING - MARGIN, myY));

        if (isHost) {
            if (players[myId]) {
                players[myId].x = myX;
                players[myId].y = myY;
                players[myId].color = myColor;
            } else {
                players[myId] = { x: myX, y: myY, color: myColor, isHost: true };
            }
            broadcastState();
        } else {
            sendMyPos();
        }
    }

    function gameLoop() {
        updatePosition();
        drawScene();
        requestAnimationFrame(gameLoop);
    }

    // ============================================================
    //  رویدادها
    // ============================================================
    function handlePointerStart(e) {
        e.preventDefault();
        isDragging = true;
        joystickZone.classList.add('active');
        updateJoystickPosition(e);
    }
    function handlePointerMove(e) {
        e.preventDefault();
        if (isDragging) updateJoystickPosition(e);
    }
    function handlePointerEnd(e) {
        e.preventDefault();
        isDragging = false;
        joystickZone.classList.remove('active');
        joystickThumb.style.transform = 'translate(-50%, -50%)';
        joyX = 0; joyY = 0;
    }
    function updateJoystickPosition(e) {
        const rect = joystickZone.getBoundingClientRect();
        const centerX = rect.left + rect.width/2;
        const centerY = rect.top + rect.height/2;
        const radius = rect.width/2;

        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;
        const distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
        const maxDist = radius - 15;

        let clampedX = deltaX, clampedY = deltaY;
        if (distance > maxDist) {
            clampedX = (deltaX/distance) * maxDist;
            clampedY = (deltaY/distance) * maxDist;
        }
        joystickThumb.style.transform = `translate(calc(-50% + ${clampedX}px), calc(-50% + ${clampedY}px))`;
        joyX = clampedX / maxDist;
        joyY = clampedY / maxDist;
    }

    joystickZone.addEventListener('pointerdown', handlePointerStart);
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerEnd);
    document.addEventListener('pointercancel', handlePointerEnd);
    joystickZone.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerStart(e); }, { passive: false });
    document.addEventListener('touchmove', (e) => { if (isDragging) { e.preventDefault(); handlePointerMove(e); } }, { passive: false });
    document.addEventListener('touchend', handlePointerEnd, { passive: false });
    document.addEventListener('touchcancel', handlePointerEnd, { passive: false });

    document.addEventListener('keydown', (e) => {
        if (e.key in keys) { keys[e.key] = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', (e) => {
        if (e.key in keys) { keys[e.key] = false; e.preventDefault(); }
    });

    // ============================================================
    //  راه‌اندازی
    // ============================================================
    startPeer();
    gameLoop();

    setInterval(() => {
        if (!isHost && hostConnection && hostConnection.open) {
            sendMyPos();
        }
    }, 50);

    console.log('🎮 بازی با PeerJS (نسخه نهایی) راه‌اندازی شد.');
</script>
</body>
</html>
