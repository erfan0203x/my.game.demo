<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 استیکمن آنلاین</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .game-wrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            max-width: 100%;
        }
        #gameCanvas {
            display: block;
            background-color: #eef2f7;
            border-radius: 16px;
            width: 600px;
            height: 400px;
            max-width: 100%;
            height: auto;
            aspect-ratio: 600/400;
            box-shadow: inset 0 0 0 2px #0f3460;
            touch-action: none;
            cursor: default;
        }
        .joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            touch-action: none;
            z-index: 10;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .joystick-thumb {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #e6a800);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(255,215,0,0.5), inset 0 -3px 0 rgba(0,0,0,0.2);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: box-shadow 0.1s;
            pointer-events: none;
            touch-action: none;
        }
        .joystick-zone.active .joystick-thumb {
            box-shadow: 0 0 30px rgba(255,215,0,0.8), inset 0 -3px 0 rgba(0,0,0,0.2);
        }
        .info-bar {
            margin-top: 16px;
            color: #a8b2d1;
            text-align: center;
            font-size: 14px;
            background: #0f172a;
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .info-bar .badge {
            background: #2d3748;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
        #statusText {
            color: #f1c40f;
            font-weight: 600;
        }
        #posStatus {
            color: #cbd5e1;
            font-size: 13px;
        }
        @media (max-width: 650px) {
            .game-wrapper { padding: 10px; border-radius: 20px; }
            .joystick-zone { width: 100px; height: 100px; bottom: 20px; left: 20px; }
            .joystick-thumb { width: 50px; height: 50px; }
        }
        .error-msg {
            color: #ff6b6b;
            font-weight: bold;
            background: #2d1b1b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="joystick-zone" id="joystickZone">
        <div class="joystick-thumb" id="joystickThumb"></div>
    </div>

    <div class="info-bar">
        <div>🕹️ <span id="statusText">در حال اتصال...</span></div>
        <div class="badge">⌨️ فلش‌ها / WASD</div>
        <div id="posStatus">📍 (300, 200)</div>
    </div>
</div>

<script>
    // ============================================================
    //  تنظیمات
    // ============================================================
    const ROOM = 'stickman-room';
    const WS_URL = 'wss://demo.piesocket.com/v3/1?api_key=VCXCEuvhGcBDP7XhiJJUDvR1e1D3eiVjgZ9VRiaV&notify_self';

    // ---- متغیرهای اصلی ----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const posStatus = document.getElementById('posStatus');
    const statusText = document.getElementById('statusText');

    const W = 600, H = 400;
    const PADDING = 30;
    const SPEED = 4.5;
    const MARGIN = 25;

    let myX = W/2, myY = H/2;
    let myColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
    let myId = 'p' + Math.random().toString(36).substr(2, 6);

    let players = {};
    let isHost = false;
    let isConnected = false;
    let socket = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 5;
    let hostCheckDone = false;

    // ---- جوی‌استیک ----
    const joystickZone = document.getElementById('joystickZone');
    const joystickThumb = document.getElementById('joystickThumb');
    let isDragging = false;
    let joyX = 0, joyY = 0;

    // ---- کیبورد ----
    const keys = {
        ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
        w: false, a: false, s: false, d: false
    };

    // ============================================================
    //  توابع رسم
    // ============================================================
    function drawStickman(cx, cy, color = '#1a2639', isMe = false, host = false) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.arc(cx, cy - 22, 16, 0, Math.PI * 2);
        ctx.fillStyle = '#ffe0b0';
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1a2639';
        ctx.beginPath();
        ctx.arc(cx - 6, cy - 26, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 6, cy - 26, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx, cy - 6);
        ctx.lineTo(cx, cy + 18);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx - 18, cy + 2);
        ctx.lineTo(cx + 18, cy + 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx, cy + 18);
        ctx.lineTo(cx - 14, cy + 40);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx, cy + 18);
        ctx.lineTo(cx + 14, cy + 40);
        ctx.stroke();

        ctx.fillStyle = '#d32f2f';
        ctx.beginPath();
        ctx.ellipse(cx - 14, cy + 41, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 14, cy + 41, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        if (isMe) {
            ctx.fillStyle = '#ffd700';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⭐', cx, cy - 45);
        }
        if (host) {
            ctx.fillStyle = '#ffd700';
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('👑', cx + 30, cy - 45);
        }

        ctx.restore();
    }

    function drawScene() {
        ctx.clearRect(0, 0, W, H);

        ctx.save();
        ctx.strokeStyle = '#2979ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#2979ff40';
        ctx.shadowBlur = 12;
        ctx.strokeRect(PADDING, PADDING, W - (PADDING*2), H - (PADDING*2));
        ctx.fillStyle = '#e3f2fd20';
        ctx.fillRect(PADDING, PADDING, W - (PADDING*2), H - (PADDING*2));
        ctx.restore();

        for (let id in players) {
            if (id === myId) continue;
            const p = players[id];
            if (p) {
                drawStickman(p.x, p.y, p.color, false, p.isHost);
            }
        }
        drawStickman(myX, myY, myColor, true, isHost);

        const count = Object.keys(players).length;
        posStatus.textContent = `📍 (${Math.round(myX)}, ${Math.round(myY)})  |  بازیکنان: ${count}`;
    }

    // ============================================================
    //  WebSocket
    // ============================================================
    function connectWS() {
        if (reconnectAttempts >= MAX_RECONNECT) {
            statusText.innerHTML = '❌ <span class="error-msg">اتصال ممکن نیست، شبکه را بررسی کنید</span>';
            return;
        }

        if (socket && socket.readyState === WebSocket.OPEN) return;

        statusText.textContent = '🔄 اتصال به سرور...';
        socket = new WebSocket(WS_URL);

        socket.onopen = () => {
            isConnected = true;
            reconnectAttempts = 0;
            statusText.textContent = '✅ متصل به سرور';
            console.log('✅ WebSocket متصل شد');

            // عضویت در اتاق
            socket.send(JSON.stringify({
                action: 'join',
                room: ROOM,
                id: myId,
                data: {
                    x: myX,
                    y: myY,
                    color: myColor,
                    isHost: false
                }
            }));

            // بعد از 3 ثانیه، اگر کسی نبود، هاست می‌شویم
            setTimeout(() => {
                if (!hostCheckDone) {
                    hostCheckDone = true;
                    // بررسی کنیم که آیا هاست وجود دارد یا خیر
                    let hostExists = false;
                    for (let id in players) {
                        if (players[id].isHost) {
                            hostExists = true;
                            break;
                        }
                    }
                    // اگر هاست وجود ندارد و ما هاست نیستیم
                    if (!hostExists && !isHost) {
                        // اگر تنها هستیم، هاست می‌شویم
                        if (Object.keys(players).length <= 1) {
                            becomeHost();
                        }
                    }
                }
            }, 3000);

            // Ping
            setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ action: 'ping' }));
                }
            }, 10000);
        };

        socket.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            } catch (err) {
                console.log('خطا در پردازش پیام:', err);
            }
        };

        socket.onclose = () => {
            isConnected = false;
            statusText.textContent = '❌ قطع شد، تلاش مجدد...';
            console.log('❌ WebSocket قطع شد');

            reconnectAttempts++;
            setTimeout(() => {
                if (!isConnected) {
                    connectWS();
                }
            }, 3000 * Math.min(reconnectAttempts, 5));
        };

        socket.onerror = (err) => {
            console.error('❌ خطای WebSocket:', err);
        };
    }

    function handleMessage(msg) {
        if (msg.action === 'state') {
            const data = msg.data || {};
            for (let id in data) {
                if (id !== myId) {
                    players[id] = data[id];
                }
            }
            if (!players[myId]) {
                players[myId] = { x: myX, y: myY, color: myColor, isHost: isHost };
            }

            // بررسی هاست
            let hostExists = false;
            let hostId = null;
            for (let id in players) {
                if (players[id].isHost) {
                    hostExists = true;
                    hostId = id;
                    break;
                }
            }

            if (!hostExists && !isHost && Object.keys(players).length > 0) {
                // اگر هاست وجود ندارد و کسی هست، ما هاست می‌شویم
                becomeHost();
            } else if (hostExists && hostId !== myId && isHost) {
                // اگر کسی دیگر هاست شده و ما هاست بودیم، هاست را رها می‌کنیم
                isHost = false;
                players[myId].isHost = false;
                statusText.textContent = '🔗 متصل به هاست';
            } else if (hostExists && hostId === myId && !isHost) {
                // اگر خودمان هاست هستیم ولی پرچم isHost false است
                isHost = true;
                players[myId].isHost = true;
                statusText.textContent = '👑 هاست (سرور)';
            }

        } else if (msg.action === 'update') {
            const id = msg.id;
            if (id && id !== myId) {
                if (players[id]) {
                    players[id].x = msg.data.x;
                    players[id].y = msg.data.y;
                    players[id].color = msg.data.color || players[id].color;
                    players[id].isHost = msg.data.isHost || false;
                } else {
                    players[id] = {
                        x: msg.data.x,
                        y: msg.data.y,
                        color: msg.data.color || '#ff5722',
                        isHost: msg.data.isHost || false
                    };
                }
            }

        } else if (msg.action === 'leave') {
            const id = msg.id;
            if (id && id !== myId) {
                delete players[id];
                console.log('❌ بازیکن خارج شد:', id);
                // اگر هاست رفت، ما هاست می‌شویم
                let hostExists = false;
                for (let id2 in players) {
                    if (players[id2].isHost) {
                        hostExists = true;
                        break;
                    }
                }
                if (!hostExists && Object.keys(players).length > 0 && !isHost) {
                    becomeHost();
                }
            }

        } else if (msg.action === 'host_elected') {
            if (msg.id === myId) {
                becomeHost();
            }
        }
    }

    function becomeHost() {
        if (isHost) return;
        if (!isConnected) return;

        isHost = true;
        statusText.textContent = '👑 هاست (سرور)';
        console.log('✅ ما هاست شدیم');

        players[myId] = { x: myX, y: myY, color: myColor, isHost: true };
        sendMyPos();

        socket.send(JSON.stringify({
            action: 'host_elected',
            room: ROOM,
            id: myId
        }));
    }

    function sendMyPos() {
        if (!isConnected || !socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify({
            action: 'update',
            room: ROOM,
            id: myId,
            data: {
                x: myX,
                y: myY,
                color: myColor,
                isHost: isHost
            }
        }));
    }

    // ============================================================
    //  حلقه بازی
    // ============================================================
    function updatePosition() {
        let dx = 0, dy = 0;
        if (isDragging) {
            dx = joyX * SPEED;
            dy = joyY * SPEED;
        } else {
            if (keys.ArrowLeft || keys.a) dx = -SPEED;
            if (keys.ArrowRight || keys.d) dx = SPEED;
            if (keys.ArrowUp || keys.w) dy = -SPEED;
            if (keys.ArrowDown || keys.s) dy = SPEED;
        }

        myX += dx;
        myY += dy;
        myX = Math.max(PADDING + MARGIN, Math.min(W - PADDING - MARGIN, myX));
        myY = Math.max(PADDING + MARGIN, Math.min(H - PADDING - MARGIN, myY));

        players[myId] = { x: myX, y: myY, color: myColor, isHost: isHost };
        sendMyPos();
    }

    function gameLoop() {
        updatePosition();
        drawScene();
        requestAnimationFrame(gameLoop);
    }

    // ============================================================
    //  رویدادهای جوی‌استیک و کیبورد
    // ============================================================
    function handlePointerStart(e) {
        e.preventDefault();
        isDragging = true;
        joystickZone.classList.add('active');
        updateJoystickPosition(e);
    }
    function handlePointerMove(e) {
        e.preventDefault();
        if (isDragging) updateJoystickPosition(e);
    }
    function handlePointerEnd(e) {
        e.preventDefault();
        isDragging = false;
        joystickZone.classList.remove('active');
        joystickThumb.style.transform = 'translate(-50%, -50%)';
        joyX = 0; joyY = 0;
    }
    function updateJoystickPosition(e) {
        const rect = joystickZone.getBoundingClientRect();
        const centerX = rect.left + rect.width/2;
        const centerY = rect.top + rect.height/2;
        const radius = rect.width/2;

        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;
        const distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
        const maxDist = radius - 15;

        let clampedX = deltaX, clampedY = deltaY;
        if (distance > maxDist) {
            clampedX = (deltaX/distance) * maxDist;
            clampedY = (deltaY/distance) * maxDist;
        }
        joystickThumb.style.transform = `translate(calc(-50% + ${clampedX}px), calc(-50% + ${clampedY}px))`;
        joyX = clampedX / maxDist;
        joyY = clampedY / maxDist;
    }

    joystickZone.addEventListener('pointerdown', handlePointerStart);
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerEnd);
    document.addEventListener('pointercancel', handlePointerEnd);
    joystickZone.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerStart(e); }, { passive: false });
    document.addEventListener('touchmove', (e) => { if (isDragging) { e.preventDefault(); handlePointerMove(e); } }, { passive: false });
    document.addEventListener('touchend', handlePointerEnd, { passive: false });
    document.addEventListener('touchcancel', handlePointerEnd, { passive: false });

    document.addEventListener('keydown', (e) => {
        if (e.key in keys) { keys[e.key] = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', (e) => {
        if (e.key in keys) { keys[e.key] = false; e.preventDefault(); }
    });

    // ============================================================
    //  راه‌اندازی
    // ============================================================
    connectWS();
    gameLoop();

    setInterval(() => {
        if (isConnected) {
            sendMyPos();
        }
    }, 50);

    console.log('🎮 بازی با WebSocket (نسخه نهایی) راه‌اندازی شد.');
</script>
</body>
</html>
